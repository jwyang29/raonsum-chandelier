<text x="14.00" y="198.00" font-size="3.1" fill="#15181c" font-weight="600" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">•  검은 사각형이 100 mm 인가</text>
<text x="17.50" y="202.10" font-size="2.75" fill="#6b7784" font-weight="400" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">자로 재세요. 여기가 틀리면 월드 전체가 그 비율로 틀어집니다.</text>
<text x="14.00" y="206.20" font-size="3.1" fill="#15181c" font-weight="600" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">•  중심에서 420 mm 인가</text>
<text x="17.50" y="210.30" font-size="2.75" fill="#6b7784" font-weight="400" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">네 장 모두 같은 거리. 장치 한가운데에서 마커 한가운데까지.</text>
<text x="14.00" y="214.40" font-size="3.1" fill="#15181c" font-weight="600" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">•  네 장이 한 방향인가</text>
<text x="17.50" y="218.50" font-size="2.75" fill="#6b7784" font-weight="400" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">둥근 좌대에는 맞출 모서리가 없습니다. 테이프로 기준선 하나를 긋고</text>
<text x="17.50" y="222.60" font-size="2.75" fill="#6b7784" font-weight="400" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">네 장을 그 선과 나란히 놓으세요.</text>
<text x="14.00" y="226.70" font-size="3.1" fill="#15181c" font-weight="600" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">•  흰 여백을 안 잘랐는가</text>
<text x="17.50" y="230.80" font-size="2.75" fill="#6b7784" font-weight="400" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">여백이 없으면 검출기가 사각형을 못 찾습니다.</text>
<text x="14.00" y="234.90" font-size="3.1" fill="#15181c" font-weight="600" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">•  무광인가</text>
<text x="17.50" y="239.00" font-size="2.75" fill="#6b7784" font-weight="400" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">유광은 조명이 반사되면 그 마커가 통째로 사라집니다.</text>
<line x1="14.00" y1="246.10" x2="196.00" y2="246.10" stroke="#d6dbe0" stroke-width="0.3"/>
<text x="14.00" y="252.60" font-size="3.4" fill="#c2185b" font-weight="700" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">붙인 뒤 재서 여기 적으세요</text>
<text x="14.00" y="257.80" font-size="2.8" fill="#6b7784" font-weight="400" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">설치가 끝나면 못 옮깁니다. 실제 자리를 숫자로 넣어 보정합니다.</text>
<text x="14.00" y="262.00" font-size="2.8" fill="#6b7784" font-weight="400" text-anchor="start" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">장치 한가운데가 원점입니다. 거기서 마커 한가운데까지 재세요.</text>
