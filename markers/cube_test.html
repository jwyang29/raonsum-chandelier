<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>마커가 몇 픽셀이면 읽히나</title>
<style>
 body{margin:0;padding:18px;background:#12161c;color:#d8e0ea;font:13px/1.6 system-ui,sans-serif}
 h1{font-size:15px;margin:0 0 6px} p{color:#8b97a6;font-size:12px;margin:0 0 12px;max-width:800px}
 table{border-collapse:collapse;font:12px ui-monospace,monospace;margin-bottom:14px}
 td,th{border:1px solid #2a323d;padding:4px 9px;text-align:center}
 th{color:#8b97a6;font-weight:500}
 .ok{color:#7fd4c1} .mid{color:#e8b36b} .no{color:#e8736b}
 #log{white-space:pre;color:#7f8b99;font:11.5px ui-monospace,monospace}
</style>
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
</head><body>
<h1>마커가 영상에서 몇 픽셀이면 읽히나</h1>
<p>천장에 매단 작은 큐브에 마커를 붙이면 영상에서 아주 작게 잡힌다. 얼마나 작아져도 읽히는지,
비스듬히 봐도 읽히는지를 실제 검출기에 넣어 잰다. 가로는 흰 여백 포함 블록의 픽셀 수이고,
기울기는 정면에서 벗어난 각이다 (가로로 cos 만큼 줄어든 것으로 흉내낸다).
검은 칸 밝기는 51(#333), 마커 넷 x 흐림 둘 = 8 판씩이다.</p>
<div id="out">불러오는 중</div>
<div id="log"></div>
<script>
const CODES = [0, 7, 44, 63];
const QS = new URLSearchParams(location.search);
// 영상 크기. ?w=1920&h=1440 으로 올려서 다시 잴 수 있다.
const FW = parseInt(QS.get("w") || "1280", 10);
const FH = parseInt(QS.get("h") || "960", 10);
// 🔴 AR.js 는 영상 크기(source)와 실제 검출 처리 크기(canvas)가 따로다.
//    canvasWidth 를 안 주면 기본이 640x480 이라 1280 영상을 반으로 줄여서 읽는다.
//    app.js 는 영상 크기와 같게 줘서 전체 해상도로 읽는다. 여기도 그래야
//    실제와 같은 값이 나온다. ?cw=640&ch=480 으로 옛 설정을 재현해 볼 수 있다.
const CW = parseInt(QS.get("cw") || String(FW), 10);
const CH = parseInt(QS.get("ch") || String(FH), 10);
// ⚠️ 흐림은 해상도에 비례해 키운다. 실제 렌즈의 번짐은 각도로 정해지므로
//    픽셀 수로 보면 해상도에 비례한다. 안 키우면 고해상도가 부당하게 유리해진다.
const BLUR = [0, 1.0 * FW / 1280];
const BLOCKS = (QS.get("blocks") || "18,24,30,36,45,54,66,80,100,120,150")
  .split(",").map(Number);                              // 흰 여백 포함 한 변 (px)
const TILTS = [0, 30, 45, 60];
const INK = 51;
const log = (s) => document.getElementById("log").textContent += s + "\n";

function make(img, blockPx, tiltDeg, blur) {
  const W = FW, H = FH;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#6e6e6e"; g.fillRect(0, 0, W, H);      // 전시장 벽/천장 어림

  const t = document.createElement("canvas");
  t.width = t.height = img.width;
  const tg = t.getContext("2d");
  tg.drawImage(img, 0, 0);
  const d = tg.getImageData(0, 0, t.width, t.height);
  for (let i = 0; i < d.data.length; i += 4)
    if (d.data[i] < 128) { d.data[i] = d.data[i+1] = d.data[i+2] = INK; }
  tg.putImageData(d, 0, 0);

  const sq = Math.cos(tiltDeg * Math.PI / 180);
  const bw = blockPx * sq, bh = blockPx;
  const quiet = 0.25 / 1.5;                              // 블록 대비 여백 비율
  g.save();
  g.translate((W - bw) / 2, (H - bh) / 2);
  g.fillStyle = "#fff"; g.fillRect(0, 0, bw, bh);
  if (blur) g.filter = `blur(${blur}px)`;
  g.drawImage(t, bw * quiet, bh * quiet, bw * (1 - 2*quiet), bh * (1 - 2*quiet));
  g.restore();
  return c;
}

const load = (src) => new Promise((res, rej) => {
  const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

(async () => {
  const imgs = {};
  for (const c of CODES) imgs[c] = await load(`src/${c}.png`);

  const blob = await new Promise(r => make(imgs[0], 100, 0, 0).toBlob(r));
  const sc = document.createElement("a-scene");
  sc.setAttribute("embedded", "");
  sc.setAttribute("vr-mode-ui", "enabled: false");
  sc.setAttribute("arjs", "sourceType: image; sourceUrl: " + URL.createObjectURL(blob) +
    "; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best;" +
    ` sourceWidth: ${FW}; sourceHeight: ${FH}; canvasWidth: ${CW}; canvasHeight: ${CH}`);
  sc.style.cssText = "position:fixed;left:-9999px;width:2px;height:2px";
  const m = document.createElement("a-marker");
  m.setAttribute("type", "barcode"); m.setAttribute("value", "0");
  sc.appendChild(m); sc.appendChild(document.createElement("a-entity"));
  document.body.appendChild(sc);

  const ctrl = await new Promise((res, rej) => {
    const t0 = Date.now();
    const tick = () => {
      const s = sc.systems && sc.systems.arjs;
      const c = s && s._arSession && s._arSession.arContext && s._arSession.arContext.arController;
      if (c) return res(c);
      if (Date.now() - t0 > 25000) return rej(new Error("검출기를 못 찾음"));
      setTimeout(tick, 200);
    };
    tick();
  });
  log(`영상 ${FW}x${FH}, 검출 처리 ${CW}x${CH}, ` +
      `흐림 ${BLUR.map(v => v.toFixed(2)).join(" / ")}px`);
  log("검출기 확보, 문턱 모드 " + ctrl.getThresholdMode() + " 값 " + ctrl.getThreshold());

  let seen = [];
  ctrl.addEventListener("getMarker", e => { if (e.data.marker.idMatrix >= 0) seen.push(e.data.marker.idMatrix); });

  const res = {};
  for (const blockPx of BLOCKS) {
    for (const tilt of TILTS) {
      let hit = 0, tot = 0;
      for (const code of CODES) for (const blur of BLUR) {
        seen = [];
        ctrl.process(make(imgs[code], blockPx, tilt, blur));
        tot++; if (seen.includes(code)) hit++;
      }
      res[`${blockPx}_${tilt}`] = `${hit}/${tot}`;
    }
    log(`블록 ${blockPx}px  ` + TILTS.map(t => `${t}도 ${res[blockPx+"_"+t]}`).join("  "));
  }

  let html = "<table><tr><th>블록 (px)</th><th>검은 사각형</th>" +
    TILTS.map(t => `<th>${t}도</th>`).join("") + "</tr>";
  for (const b of BLOCKS) {
    html += `<tr><td>${b}</td><td>${Math.round(b/1.5)}px</td>`;
    for (const t of TILTS) {
      const v = res[`${b}_${t}`], n = parseInt(v);
      html += `<td class="${n===8?'ok':(n>=5?'mid':'no')}">${v}</td>`;
    }
    html += "</tr>";
  }
  document.getElementById("out").innerHTML = html + "</table>";
  window.__res = res; window.__done = true;
})().catch(e => { document.getElementById("out").textContent = "실패: " + e; log(String(e.stack||e)); window.__done = "err"; });
</script>
</body></html>
