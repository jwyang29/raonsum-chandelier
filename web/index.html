<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Facets Between Us</title>
  <meta name="theme-color" content="#000000">
  <meta name="description" content="관객의 손짓이 조각이 되어 천장으로 떠오르는 참여형 AR 설치. 양지원, 2026">
  <style>
    /* 🔴 QR 로 처음 열리는 화면이다. 글과 목차가 먼저 떠야 한다.
       히어로의 THREE 는 2MB 라 다 그린 뒤에 따로 받아 온다 (hero.js).
       AR.js 와 카메라 권한은 여기서 손대지 않는다. 열자마자 물으면 거절당한다. */

    /* 포인트 색은 크리스탈 틴트(config.js 의 TINTS)에서 가져왔다.
       원본은 검정 위에서 흰색으로 뭉개질 만큼 엷어서, 색상은 그대로 두고
       채도만 올렸다. 작품에 없는 색을 새로 들이지 않으려고 그렇게 했다. */
    :root {
      --bg: #000;
      --fg: #fff;
      --mute: #8b8b8b;
      --line: #2b2b2b;
      --c1: #73de9f;
      --c2: #7e73de;
      --c3: #73b7de;
      --c4: #cc73de;
      --c5: #73de88;
      --mono: ui-monospace, "SF Mono", Menlo, "Roboto Mono", monospace;
      --sans: -apple-system, "Helvetica Neue", "Apple SD Gothic Neo",
              "Noto Sans KR", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
    body {
      font: 15px/1.7 var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .wrap { max-width: 640px; margin: 0 auto; }

    /* 맨 위 띠 */
    .bar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 14px 18px; border-bottom: 1px solid var(--line);
      font: 600 10.5px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase;
    }
    .bar .mid { color: var(--mute); }

    /* 히어로. 크리스탈이 도는 자리 */
    #hero {
      position: relative; height: 46vh; min-height: 260px; max-height: 420px;
      border-bottom: 1px solid var(--line);
      cursor: pointer; touch-action: manipulation;
      /* 유리는 뒤에 있는 것 때문에 보인다. 완전한 검정 위에서는 사라진다.
         아주 엷은 빛 하나를 깔아 조각이 받칠 것을 준다. */
      background:
        radial-gradient(60% 52% at 50% 44%, #16202b 0%, #0a0d11 58%, #000 100%);
    }
    #hero canvas { opacity: 0; transition: opacity .9s ease; }
    #hero.ready canvas { opacity: 1; }
    #hero .wait {
      position: absolute; inset: 0; display: grid; place-items: center;
      font: 500 10.5px/1 var(--mono); letter-spacing: .24em; color: #3a3a3a;
      text-transform: uppercase; transition: opacity .4s ease;
    }
    #hero.ready .wait { opacity: 0; }
    #hero .hint {
      position: absolute; left: 18px; bottom: 14px; pointer-events: none;
      font: 500 10px/1 var(--mono); letter-spacing: .18em; color: #4e4e4e;
      text-transform: uppercase; opacity: 0; transition: opacity .6s ease .6s;
    }
    #hero.ready .hint { opacity: 1; }

    /* 목차 */
    .menulabel { padding: 16px 18px 10px; font: 600 10.5px/1 var(--mono);
                 letter-spacing: .24em; color: var(--c4); text-transform: uppercase; }

    .item { border-top: 1px solid var(--line); }
    .item:last-of-type { border-bottom: 1px solid var(--line); }

    /* 줄 하나. 번호 + 이름 + 표시 */
    .head {
      display: grid; grid-template-columns: 46px 1fr 34px; align-items: center;
      padding: 17px 18px 17px 0; width: 100%;
      background: none; border: 0; color: inherit; text-decoration: none;
      font: inherit; text-align: left; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .head .n { font: 600 11px/1 var(--mono); color: var(--mute);
               padding-left: 18px; letter-spacing: .08em; }
    .head .t { font-size: 27px; font-weight: 700; letter-spacing: -.025em; }
    .head .k { font: 400 22px/1 var(--mono); color: var(--mute); text-align: right; }
    .head:active { background: #121212; }

    /* 맨 위 AR 줄만 색을 준다 */
    a.head .n, a.head .k { color: var(--c1); }
    a.head .t { color: var(--c1); }

    /* 펼쳐지는 칸 */
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] .head .k { color: var(--fg); }
    .body { padding: 2px 18px 30px; }
    .lead { font-size: 18px; line-height: 1.6; font-weight: 600;
            letter-spacing: -.01em; margin: 0 0 20px; color: var(--c3); }
    .body p { margin: 0 0 16px; font-size: 15.5px; line-height: 1.85; color: #cfcfcf; }
    .body p:last-child { margin-bottom: 0; }

    .tbl { display: grid; grid-template-columns: 76px 1fr; margin: 22px 0 0;
           border-top: 1px solid var(--line); }
    .tbl dt { font: 600 10.5px/1.9 var(--mono); letter-spacing: .14em; color: var(--mute);
              padding: 9px 0; border-bottom: 1px solid var(--line); text-transform: uppercase; }
    .tbl dd { margin: 0; padding: 9px 0; font-size: 14.5px;
              border-bottom: 1px solid var(--line); }
    .tbl dd a { color: var(--c3); text-decoration: none;
                border-bottom: 1px solid currentColor; }

    .who { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
           margin: 0 0 18px; }
    .who b { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
    .who span { font: 500 10.5px/1 var(--mono); letter-spacing: .22em; color: var(--mute); }

    /* 라이브 시연 */
    .live { border-top: 1px solid var(--line); border-left: 4px solid var(--c4);
            padding: 18px 18px 20px; }
    .live .label { font: 600 10.5px/1 var(--mono); letter-spacing: .24em;
                   color: var(--c4); text-transform: uppercase; }
    .live .d { font: 700 13.5px/1.5 var(--mono); letter-spacing: .03em; margin: 9px 0 6px; }
    .live p { margin: 0; color: var(--mute); font-size: 14.5px; }

    footer { padding: 24px 18px 36px; font: 500 10px/1.8 var(--mono);
             letter-spacing: .16em; color: #454545; text-transform: uppercase; }

    @media (min-width: 560px) {
      .head .t { font-size: 32px; }
      #hero { height: 50vh; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar" id="bar"></div>
    <div id="hero">
      <div class="wait">loading</div>
      <div class="hint">tap to change</div>
    </div>
    <div id="menu"></div>
  </div>

  <script type="module">
    import { CONTENT as C } from "./content.js";

    const esc = (s) => String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
    // 빈 값은 통째로 빼고 그린다. 안 채운 칸이 빈 상자로 남으면 더 흉하다.
    const has = (v) => v !== null && v !== undefined && String(v).trim() !== "";
    const rows = (list) => (list || []).filter((r) => has(r[0]) || has(r[1]));

    document.getElementById("bar").innerHTML = `
      <span>${esc(C.title || "")}</span>
      <span class="mid">${esc(C.exhibit || "")}</span>
      <span>${esc(C.year || "")}</span>`;

    const M = C.menu || {};
    const W = C.work || {};
    const A = C.artist || {};
    const paras = (W.paras || []).filter(has);
    const bio = (A.bio || []).filter(has);

    const table = (list) => rows(list).map(([k, v, href]) =>
      `<dt>${esc(k)}</dt><dd>${has(href)
        ? `<a href="${esc(href)}"${String(href).startsWith("http")
            ? ' target="_blank" rel="noopener"' : ""}>${esc(v)}</a>`
        : esc(v)}</dd>`).join("");

    const item = (n, label, inner) => inner ? `
      <details class="item">
        <summary><div class="head">
          <span class="n">${n}</span><span class="t">${esc(label)}</span>
          <span class="k">+</span>
        </div></summary>
        <div class="body">${inner}</div>
      </details>` : "";

    document.getElementById("menu").innerHTML = `
      <div class="menulabel">Menu</div>

      <div class="item"><a class="head" href="./ar.html">
        <span class="n">00</span><span class="t">${esc(M.ar || "AR 보기")}</span>
        <span class="k">&#8594;</span>
      </a></div>

      ${item("01", M.work || "작품 소개",
        (has(W.lead) ? `<p class="lead">${esc(W.lead)}</p>` : "") +
        paras.map((p) => `<p>${esc(p)}</p>`).join("") +
        (rows(W.facts).length ? `<dl class="tbl">${table(W.facts)}</dl>` : ""))}

      ${item("02", M.artist || "작가 소개",
        `<div class="who"><b>${esc(A.name || "")}</b>
           <span>${esc(A.nameEn || "")}</span></div>` +
        bio.map((p) => `<p>${esc(p)}</p>`).join("") +
        (rows(A.links).length ? `<dl class="tbl">${table(A.links)}</dl>` : ""))}

      ${C.live && (has(C.live.head) || has(C.live.dates) || has(C.live.body)) ? `
        <div class="live">
          ${has(C.live.head) ? `<span class="label">${esc(C.live.head)}</span>` : ""}
          ${has(C.live.dates) ? `<div class="d">${esc(C.live.dates)}</div>` : ""}
          ${has(C.live.body) ? `<p>${esc(C.live.body)}</p>` : ""}
        </div>` : ""}

      <footer>${esc(C.exhibit || "")} ${esc(C.year || "")}</footer>`;

    // 펼치고 접을 때 + 가 x 로 바뀐다
    for (const d of document.querySelectorAll("details.item")) {
      d.addEventListener("toggle", () => {
        d.querySelector(".k").textContent = d.open ? "×" : "+";
      });
    }

    // 글과 목차가 다 뜬 뒤에 히어로를 시작한다. THREE 가 2MB 라 먼저 받으면
    // 설명을 읽기도 전에 기다리게 된다.
    addEventListener("load", async () => {
      try {
        const { startHero } = await import("./hero.js");
        await startHero(document.getElementById("hero"));
      } catch (e) {
        // 히어로가 안 떠도 페이지는 멀쩡해야 한다. 자리만 접는다.
        console.warn("[hero] 못 띄웠습니다", e);
        document.getElementById("hero").style.display = "none";
      }
      const l = document.createElement("link");
      l.rel = "prefetch";
      l.href = "./vendor/aframe-ar.js";
      document.head.appendChild(l);
    });
  </script>
</body>
</html>
