<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>가상 샹들리에</title>
  <meta name="theme-color" content="#0b0f14">
  <meta name="description" content="천에 그은 선이 크리스탈이 되어 떠오르는 웹 AR 설치">
  <style>
    /* 🔴 QR 로 처음 열리는 화면이다. A-Frame 도 AR.js 도 안 부른다.
       4MB 를 받게 하면 설명을 읽기도 전에 기다리게 된다. AR 은 버튼 뒤에 있다.
       카메라 권한도 여기서 안 묻는다. 묻자마자 물어보면 거절당한다. */
    :root {
      --bg: #0b0f14;
      --fg: #e8edf3;
      --mute: #8b97a6;
      --line: #1e2630;
      --accent: #7fd4c1;
      --accent-ink: #06231c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
    body {
      font: 16px/1.75 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 0 20px calc(28px + env(safe-area-inset-bottom));
    }
    .wrap { max-width: 560px; margin: 0 auto; }

    /* 맨 위 */
    header { padding: 56px 0 36px; }
    .sub {
      font-size: 12px; letter-spacing: .18em; color: var(--accent);
      text-transform: uppercase; margin: 0 0 14px;
    }
    h1 { margin: 0; font-size: 34px; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; }
    .artist { margin: 12px 0 0; color: var(--mute); font-size: 14px; }

    /* 작품 설명 */
    .about p { margin: 0 0 18px; color: #c6d0db; }
    .about p:last-child { margin-bottom: 0; }

    hr { border: 0; border-top: 1px solid var(--line); margin: 36px 0; }

    /* 관객이 할 일 */
    h2 { font-size: 12px; letter-spacing: .16em; color: var(--mute);
         text-transform: uppercase; margin: 0 0 18px; font-weight: 600; }
    ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
    ol.steps li {
      counter-increment: s; position: relative;
      padding: 0 0 20px 42px; margin: 0;
    }
    ol.steps li:last-child { padding-bottom: 0; }
    ol.steps li::before {
      content: counter(s); position: absolute; left: 0; top: 2px;
      width: 26px; height: 26px; border-radius: 50%;
      border: 1px solid var(--line); color: var(--accent);
      font-size: 12px; font-weight: 600; display: grid; place-items: center;
    }
    ol.steps b { display: block; font-size: 16px; font-weight: 600; }
    ol.steps span { color: var(--mute); font-size: 14.5px; }

    /* AR 버튼. 엄지로 닿는 자리에 크게 둔다 */
    .cta { margin: 36px 0 0; }
    a.go {
      display: block; text-align: center; text-decoration: none;
      background: var(--accent); color: var(--accent-ink);
      font-size: 17px; font-weight: 700; letter-spacing: -.01em;
      padding: 19px 20px; border-radius: 14px;
      box-shadow: 0 8px 30px rgba(127, 212, 193, .16);
    }
    a.go:active { transform: translateY(1px); }
    .cta .note { text-align: center; color: var(--mute); font-size: 13px; margin: 14px 0 0; }

    /* 라이브 시연 */
    .live {
      margin: 36px 0 0; padding: 18px 20px;
      border: 1px solid var(--line); border-radius: 12px; background: #0f151c;
    }
    .live b { display: block; font-size: 13px; letter-spacing: .1em;
              color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }
    .live p { margin: 0; color: #c6d0db; font-size: 14.5px; white-space: pre-line; }

    footer { margin: 44px 0 0; padding-top: 22px; border-top: 1px solid var(--line);
             color: #5f6b79; font-size: 12.5px; line-height: 1.9; }

    @media (min-width: 620px) {
      header { padding-top: 84px; }
      h1 { font-size: 42px; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>

  <script type="module">
    import { CONTENT as C } from "./content.js";

    const esc = (s) => String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    // 빈 값은 통째로 빼고 그린다. 안 채운 칸이 빈 상자로 남으면 더 흉하다.
    const has = (v) => v !== null && v !== undefined && String(v).trim() !== "";

    const steps = (C.steps || []).filter((s) => has(s.head) || has(s.body));
    const about = (C.about || []).filter(has);
    const credits = (C.credits || []).filter(has);

    document.getElementById("app").innerHTML = `
      <header>
        ${has(C.subtitle) ? `<p class="sub">${esc(C.subtitle)}</p>` : ""}
        <h1>${esc(C.title || "")}</h1>
        ${has(C.artist) ? `<p class="artist">${esc(C.artist)}</p>` : ""}
      </header>

      ${about.length ? `<div class="about">${
        about.map((p) => `<p>${esc(p)}</p>`).join("")}</div><hr>` : ""}

      ${steps.length ? `<h2>보는 법</h2><ol class="steps">${
        steps.map((s) => `<li><b>${esc(s.head)}</b><span>${esc(s.body)}</span></li>`)
             .join("")}</ol>` : ""}

      <div class="cta">
        <a class="go" href="./ar.html">${esc(C.ctaLabel || "AR 로 보기")}</a>
        ${has(C.ctaNote) ? `<p class="note">${esc(C.ctaNote)}</p>` : ""}
      </div>

      ${C.live && (has(C.live.head) || has(C.live.body)) ? `
        <div class="live">
          ${has(C.live.head) ? `<b>${esc(C.live.head)}</b>` : ""}
          ${has(C.live.body) ? `<p>${esc(C.live.body)}</p>` : ""}
        </div>` : ""}

      ${credits.length ? `<footer>${
        credits.map((c) => esc(c)).join("<br>")}</footer>` : ""}
    `;

    // 설명을 읽는 동안 AR 쪽 큰 파일을 미리 받아 둔다. 버튼을 누르면 바로 뜬다.
    // 느린 망에서 본문이 먼저 보여야 하므로 그릴 것 다 그리고 나서 시작한다.
    addEventListener("load", () => {
      for (const src of ["./vendor/aframe.min.js", "./vendor/aframe-ar.js"]) {
        const l = document.createElement("link");
        l.rel = "prefetch";
        l.href = src;
        document.head.appendChild(l);
      }
    });
  </script>
</body>
</html>
